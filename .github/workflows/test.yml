name: Python Test

on:
  workflow_dispatch:

jobs:
   test:
      runs-on: ubuntu-latest

      steps:
         - name: Get Code
           uses: actions/checkout@v4

         - name: Set up 
           uses: actions/setup-python@v4
           with:
               python-version: '3.14'

         - name: Install pytest
           run: pip install pytest

         - name: Run
           run: pytest 
        
